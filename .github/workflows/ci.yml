name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; artifact upload does not need a token scope.
permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    # A hung Gradle daemon would otherwise hold the runner for the 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle/gradle-daemon-jvm.properties pins the daemon to JDK 21. Installing it here is what
      # keeps Gradle from auto-provisioning one over the network on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Restores the Gradle user home (dependencies, build cache, configuration cache) and validates
      # the wrapper's checksum against the published distributions.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lintRemoteDebug lintDebug

      # :app's tests are flavored, the library modules' are not, so neither task name alone
      # reaches all three. Invoked from the root, each runs in every project that has it.
      - name: Unit tests
        run: ./gradlew testRemoteDebugUnitTest testDebugUnitTest

      # Compiles the instrumented suite without running it — no device, no emulator, no cost.
      # Nothing else type-checks androidTest, so it had drifted out of sync with the code it
      # drives and stayed broken silently.
      - name: Instrumented tests compile
        run: ./gradlew compileRemoteDebugAndroidTestKotlin

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/lint-results-remoteDebug.html
            app/build/reports/tests/
            app/build/reports/ktlint/
            core/*/build/reports/tests/
            core/*/build/reports/ktlint/
          if-no-files-found: ignore
