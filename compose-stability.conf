// Types from outside the project that the Compose compiler cannot prove stable, declared stable
// here because `data/domain` may not import `androidx` and so cannot carry @Immutable itself.
// Every module goes through this file via build-logic's configureCompose.

// Immutable value types.
java.time.Instant
java.time.Duration
coil3.size.Size

// Read-only interfaces. The project never hands a composable a list it later mutates: every list
// in state is replaced by `copy`, never edited in place.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
