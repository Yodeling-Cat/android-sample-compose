# JVM args for the long-lived Gradle daemon; the AGP template's 2 GB is tight for Compose + KSP +
# Hilt, and the metaspace cap keeps annotation processing from degrading the daemon over a day.
# ParallelGC trades G1's short pauses, which a batch build has no use for, for throughput.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM that org.gradle.jvmargs does not reach.
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC

# Skips the configuration phase entirely when nothing affecting it changed (also speeds up IDE sync).
org.gradle.configuration-cache=true
# Reuses task outputs across clean builds and branch switches.
org.gradle.caching=true
# Builds independent modules concurrently.
org.gradle.parallel=true

# Kotlin code style for this project.
kotlin.code.style=official

# Syncs projects in parallel during IDE import.
org.gradle.tooling.parallel=true
